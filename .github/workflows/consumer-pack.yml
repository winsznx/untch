# Untch Consumer Pack — the governed consumer-execution suite.
#
# This workflow ALSO closes a pre-existing CI hole that predates the Consumer Pack, and it is worth
# naming because the repository has been bitten by exactly this shape before (see web.yml's header):
#
#   services/asp was covered by NO workflow. `pnpm test:asp` — 92 tests before this branch, 121 after
#   — ran nowhere. The service's own tsconfig was never run in CI either; the root `pnpm typecheck`
#   covers only packages/** + scripts/**, so a type error reachable only under services/asp/tsconfig
#   could sit in the tree indefinitely, which is precisely how the 15 TS2559 errors that motivated
#   web.yml survived. The Consumer Pack's entire HTTP surface, its orchestrator and its funding leg
#   live in that directory, so shipping it while the hole stayed open would have been adding the
#   largest untested surface in the repo to the one place CI does not look.
#
# Three gates, in order of how much they cost to run:
#
#   1. the root tsconfig (packages/** + scripts/**) — parity with every other JS workflow;
#   2. services/asp's OWN tsconfig — the gate that closes the hole;
#   3. the three suites: consumer-core, consumer-providers, and the ASP suite that contains the
#      end-to-end lifecycle tests.
#
# No credentials, no network, no Postgres and no Redis are needed. The provider fixtures are REAL 402
# responses captured from the live services on 2026-07-27 and committed under
# packages/consumer-providers/fixtures/; every adapter test drives an injected fetch. The one thing
# that would need the network — a live provider smoke test — is deliberately NOT here: it spends real
# money, and it is an operator-run proof (see docs/consumer-pack-runbook.md), not a CI step.
#
# The path filter is wide on purpose. The Consumer Pack depends on nine @untch packages, and the
# lesson web.yml records is that a change under packages/shared can break a consumer three
# directories away and nothing else.
name: consumer-pack

on:
  push:
    paths:
      - "packages/consumer-core/**"
      - "packages/consumer-providers/**"
      - "packages/policy-engine/**"
      - "packages/policy-store/**"
      - "packages/escalation/**"
      - "packages/receipt-writer/**"
      - "packages/x402-guard/**"
      - "packages/canon/**"
      - "packages/shared/**"
      - "services/asp/**"
      # The operator commands and their tests. Added because `scripts/proof-controller/**` matched NO
      # workflow: consumer-pack watched packages and services, and public-copy watched `scripts/test/**`
      # and `scripts/lint/**` but not the controller itself. A change to the one process that drives a
      # production payment would have triggered nothing, which is the same hole this workflow's header
      # was written to record.
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/consumer-pack.yml"
  pull_request:
    paths:
      - "packages/consumer-core/**"
      - "packages/consumer-providers/**"
      - "packages/policy-engine/**"
      - "packages/policy-store/**"
      - "packages/escalation/**"
      - "packages/receipt-writer/**"
      - "packages/x402-guard/**"
      - "packages/canon/**"
      - "packages/shared/**"
      - "services/asp/**"
      # The operator commands and their tests. Added because `scripts/proof-controller/**` matched NO
      # workflow: consumer-pack watched packages and services, and public-copy watched `scripts/test/**`
      # and `scripts/lint/**` but not the controller itself. A change to the one process that drives a
      # production payment would have triggered nothing, which is the same hole this workflow's header
      # was written to record.
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/consumer-pack.yml"

permissions:
  contents: read

jobs:
  consumer-pack:
    name: money safety + state machine + protocol clients + governed lifecycle
    runs-on: ubuntu-latest

    # A REAL Postgres, added after the 2026-07-29 deployment incident.
    #
    # Every suite here was previously pure, which meant the migration runner and the schema it produces
    # were never exercised by CI at all. Migration 011 was queued to run against a production database
    # that no one had rehearsed the upgrade on, and the only reason it did not run was that the build
    # failed first. A migration nobody has run on a populated database is an untested migration, and the
    # place to find that out is here rather than during a deploy.
    # Trust auth, so this workflow declares NO credential of any kind.
    #
    # The container is ephemeral, reachable only from this job, and destroyed with it, so a password
    # would protect nothing. What it would do is put a credential assignment in a committed file, which
    # secret scanners match on shape rather than on reachability. The finding is then a false one that
    # has to be dismissed, and every dismissal makes the next finding cheaper to dismiss. Removing the
    # credential removes the finding and the thing it was pointing at, which is better than annotating
    # it as safe.
    # Pinned to the version production actually runs.
    #
    # This was postgres:16-alpine while production was Postgres 18 on Railway, so the one machine that
    # gates merges tested a version nothing ran. That gap is not theoretical: the database moved to
    # Supabase Postgres 17.6, and a suite green on 16 says nothing about 17 until it is run there.
    # Pinning the minor rather than `17-alpine` is deliberate — a floating tag would silently change
    # the thing under test on an unrelated day, which is how a version regression arrives with no
    # commit to blame it on. Bump this in the same commit that bumps the target.
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: untch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THE GATE FOR THE 2026-07-29 FAILURE.
      #
      # That deployment died on `pnpm install --frozen-lockfile` because the uploaded tree's manifest
      # carried a dependency the committed lockfile had never seen. The install above would already fail
      # on a committed mismatch, so this step exists for what it adds: a NAMED failure that says which
      # importer and which dependency disagree, instead of a remote builder's install error. It runs
      # against a clean checkout, which is exactly the tree the Railway builder sees.
      - name: Manifest/lockfile consistency
        run: pnpm lint:lockfile

      # THE PRODUCTION-ONLY INSTALL GATE.
      #
      # The Solana payment path imports @solana/kit, @x402/svm, @x402/fetch and @solana-program/token at
      # MODULE LOAD, so a package misplaced into devDependencies would resolve here and vanish in
      # production. Nothing else in this workflow would notice: the workspace install above includes dev
      # dependencies, so the import would succeed in CI and fail on the deployed container.
      #
      # This installs with --prod into a clean checkout and imports the package for real. It runs in a
      # separate directory so the workspace node_modules cannot satisfy the import by accident.
      - name: Production-only install can load the Solana payment path
        run: |
          set -e
          ART=$(mktemp -d)
          git archive --format=tar HEAD | tar -x -C "$ART"
          cd "$ART"
          pnpm install --prod --frozen-lockfile --ignore-scripts
          cd "$ART/packages/consumer-providers"
          node --input-type=module -e "
            const need = ['@solana/kit','@x402/svm','@x402/fetch','@solana-program/token'];
            for (const p of need) { await import(p); console.log('loaded ' + p); }
          "

      # Parity with every other JS workflow: the root tsconfig (packages/** + scripts/**).
      - name: Typecheck (root tsconfig)
        run: pnpm typecheck

      # THE GATE THAT CLOSES THE HOLE. The root config cannot see these files at all — the ASP has
      # its own tsconfig with the same strict flags (strict, noUncheckedIndexedAccess,
      # exactOptionalPropertyTypes) and, until this step, nothing ran it.
      - name: Typecheck (services/asp tsconfig)
        run: pnpm --filter @untch/asp exec tsc --noEmit -p tsconfig.json

      # TEST_DATABASE_URL turns on the migration upgrade suite. Without it that suite skips, which is
      # correct for a developer with no local Postgres and wrong for CI: a skipped migration test on the
      # one machine that gates merges is a migration test that does not exist.
      #
      # The connection string carries no password, because the service above needs none.
      - name: Consumer core suite (money, state machine, ledger, treasury, registry, migration upgrade)
        run: |
          export TEST_DATABASE_URL="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          pnpm test:consumer-core
        env:
          PGUSER: postgres
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: untch_test
          REQUIRE_POSTGRES_TESTS: "1"

      - name: Consumer providers suite (x402 / MPP / SIWX against real captured challenges)
        run: pnpm test:consumer-providers

      # Contains the end-to-end lifecycle suite, one describe per acceptance criterion, plus every
      # pre-existing ASP handler test that had never run on a CI machine.
      #
      # TEST_DATABASE_URL is passed here for the same reason it is passed to consumer-core: the
      # operator-route integration suite proves the two properties only a real database has —
      # uniqueness enforced by the store rather than by a check-then-write, and idempotency claimed
      # durably. It found a real defect on its first run (a lost concurrent create surfaced as an
      # HTML 500 instead of a refusal), which is exactly the class of bug an in-memory store cannot
      # produce. Without the variable that suite skips, and a skipped integration test on the one
      # machine that gates merges is a test that does not exist.
      # Also contains the TWO-PROCESS suite, which spawns the controller as a real child process with a
      # scrubbed environment and drives it against this Postgres, a real worker and a real payment
      # capability. It creates its OWN database (`untch_test_proof_controller`) rather than sharing this
      # one: it and the operator-route suite both register a provider called `purch` and need it to declare
      # different settlement chains, so sharing made each fail on the other's fixture while both passed
      # alone — flakiness in appearance, a shared-fixture collision in fact.
      # REQUIRE_POSTGRES_TESTS turns the registration guard from advisory into blocking. Every Postgres
      # suite here gates itself with `describe(..., { skip })`, and node:test does not register the
      # children of a skipped describe at all — so losing TEST_DATABASE_URL does not produce skips, it
      # produces a smaller run that still reports everything green. The totals moved 567 → 416 and no
      # signal said so. With this set, that condition fails the job and names how many suites vanished.
      - name: ASP suite (handlers + governed consumer lifecycle + operator routes + two-process controller)
        run: |
          export TEST_DATABASE_URL="postgresql://${PGUSER}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          pnpm test:asp
        env:
          PGUSER: postgres
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: untch_test
          REQUIRE_POSTGRES_TESTS: "1"

      # The remote proof controller: its refusals, and the import-graph test that proves it CANNOT open a
      # database, hold a signer, construct an adapter or reach a rail client. That last one is the whole
      # architecture, and it is a property of the import graph rather than of any behaviour — so it is the
      # one test here that cannot be satisfied by a mock, and the one that must never be allowed to skip.
      - name: Remote proof controller suite (refusals + import boundary)
        run: pnpm test:controller

      # The Consumer Pack reuses the policy engine and the escalation authority boundary rather than
      # forking them. A change that breaks either must fail here too, not only in its own workflow.
      - name: Policy-engine suite (the engine the Consumer Pack reuses)
        run: pnpm test:policy

      - name: Escalation suite (the approval pipeline the Consumer Pack reuses)
        run: pnpm test:escalation
