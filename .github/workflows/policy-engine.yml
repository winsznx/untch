# Untch policy-engine suite (PRD §7.1 preflight state machine; §16 invariants I1/I2). Partial
# slice — see packages/policy-engine/README.md. Covers the terminal-state matrix (malformed,
# no-active-policy, duplicate, budget, fail-closed, approved), the §8.2 decision-trace shape, the
# per-agent concurrency lock (the budget-race before/after proof), and the rule manifest that pins
# which rules are real vs stubbed. Triggers on canon too, since @untch/policy-engine depends on it.
name: policy-engine

on:
  push:
    paths:
      - "packages/policy-engine/**"
      - "packages/canon/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/policy-engine.yml"
  pull_request:
    paths:
      - "packages/policy-engine/**"
      - "packages/canon/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/policy-engine.yml"

permissions:
  contents: read

jobs:
  policy-engine:
    name: terminal-state matrix + §8.2 trace + concurrency lock + rule manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Policy-engine suite
        run: pnpm test:policy
