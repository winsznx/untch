# Untch receipt-writer suite (PRD §7.4). Covers the batching triggers (N receipts / T seconds), the
# retry/backoff → DEGRADED_UNANCHORED path, the reorg re-verify/resubmit → CONFIRMED path, and the
# decision → §10.3 receipt / §8 ledger mapping — all driven through the ReceiptsRepo + ChainAnchor
# interfaces with an in-memory repo and a fake chain, so no Postgres/Redis/RPC is needed in CI. (The
# real-Postgres integration test skips itself unless DATABASE_URL is set.)
name: receipt-writer

on:
  push:
    paths:
      - "packages/receipt-writer/**"
      - "packages/policy-engine/**"
      - "packages/canon/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/receipt-writer.yml"
  pull_request:
    paths:
      - "packages/receipt-writer/**"
      - "packages/policy-engine/**"
      - "packages/canon/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/receipt-writer.yml"

permissions:
  contents: read

jobs:
  receipt-writer:
    name: batching triggers + retry/backoff + reorg-resubmit + mapping
    runs-on: ubuntu-latest
    # PgReceiptsRepo is the SQL the hermetic tests never touch: FOR UPDATE SKIP LOCKED claiming, the
    # bigint and numeric round-trip, the QUEUED → BATCHED → SUBMITTED → CONFIRMED walk. It skipped on
    # every CI run this workflow has ever done, because there was no database for it to find.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: untch_receipt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The suite runs its own migrations into this database, so it gets its own rather than sharing
      # the one the consumer pack uses.
      - name: Receipt-writer suite
        run: pnpm test:receipt-writer
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/untch_receipt_test
